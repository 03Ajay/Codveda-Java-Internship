# Database Configuration Properties
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/library_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=root
db.password=password

# Connection Pool Settings
db.pool.minSize=5
db.pool.maxSize=20
db.pool.timeout=30000

# Application Settings
app.name=Library Management System
app.version=1.0.0
app.debug=true

# Fine Settings (per day in rupees)
fine.per.day=2.00
fine.grace.period.days=7